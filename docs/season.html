<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Season Details - BeybladeX ELO System</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="header-section">
            <h1 id="season-title">Season Details</h1>
            <p class="subtitle" id="season-subtitle">Loading...</p>
        </div>

        <!-- Season Overview -->
        <div id="season-overview" class="info-box">
            <!-- Will be populated by JavaScript -->
        </div>

        <!-- Tier Tables -->
        <div id="tier-tables-container">
            <h2>League Tables</h2>
            <div id="tier-tables">
                <!-- Will be populated by JavaScript -->
            </div>
        </div>

        <!-- Promotion & Relegation -->
        <div id="promotion-relegation-container" style="display: none;">
            <h2>Promotion & Relegation</h2>
            <div id="promotion-relegation-content">
                <!-- Will be populated by JavaScript -->
            </div>
        </div>

        <!-- Relegation Matches -->
        <div id="relegation-matches-container" style="display: none;">
            <h2>Relegation Matches</h2>
            <div id="relegation-matches">
                <!-- Will be populated by JavaScript -->
            </div>
        </div>

        <!-- Season Cup -->
        <div id="season-cup-container" style="display: none;">
            <h2>Season Cup</h2>
            <div id="season-cup-bracket">
                <!-- Will be populated by JavaScript -->
            </div>
        </div>

        <!-- Matchdays -->
        <div id="matchdays-container" style="display: none;">
            <h2>Match Schedule by Matchday</h2>
            <div id="matchdays">
                <!-- Will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <footer id="footer-placeholder"></footer>

    <script src="navigation.js"></script>
    <script src="darkmode.js"></script>
    <script src="version-display.js"></script>
    <script src="season.js"></script>
</body>
</html>
