<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Gold Medal">
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#C8A400"/>
    </linearGradient>
  </defs>
  <!-- Ribbon left stripe -->
  <rect x="9.25" y="1" width="2.5" height="8" rx="0.5" fill="#EF4444"/>
  <!-- Ribbon right stripe -->
  <rect x="12.25" y="1" width="2.5" height="8" rx="0.5" fill="#1D4ED8"/>
  <!-- Medal disc shadow -->
  <circle cx="12" cy="16.5" r="6" fill="#92400E"/>
  <!-- Medal disc -->
  <circle cx="12" cy="16" r="6" fill="url(#mg)"/>
  <!-- Inner decorative ring -->
  <circle cx="12" cy="16" r="4.5" fill="none" stroke="#B45309" stroke-width="0.75"/>
  <!-- Numeral I -->
  <rect x="11.4" y="12.5" width="1.2" height="7" rx="0.4" fill="#78350F"/>
  <!-- Shine highlight -->
  <ellipse cx="10.2" cy="13.8" rx="1.2" ry="0.9" fill="white" opacity="0.25"/>
</svg>
