<script>
// Automatische Gallery: listet alle PNG-Dateien im /plots Ordner
const plotFiles = [
    // 💡 Einfach täglich von Python generieren lassen!
    // Python kann eine "plots.json" erzeugen, die hier eingelesen wird.
];

fetch("plots/plots.json")
    .then(r => r.json())
    .then(files => {
        const gallery = document.getElementById("gallery");
        files.forEach(f => {
            const img = document.createElement("img");
            img.src = "plots/" + f;
            img.alt = f;
            img.className = "plot";
            img.onclick = () => window.open(img.src, "_blank");
            gallery.appendChild(img);
        });
    });
</script>
