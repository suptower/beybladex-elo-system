<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>suptower Beyblade X</title>
    <link rel="icon" type="image/svg+xml" href="x.svg">
    <link rel="stylesheet" href="styles.css">
        <script src="data-paths.js"></script>
    <script defer src="version.js"></script>
    <script defer src="darkmode.js"></script>
    <script defer src="matches.js"></script>
    <script defer src="bey-hover-card.js"></script>
    <script defer src="navigation-loader.js"></script>
    <script defer src="hamburger.js"></script>
    <script defer src="navigation.js"></script>
</head>
<body>

<a href="#main-content" class="skip-to-content">Skip to main content</a>

<header>
    <a href="index.html" class="header-link">
        <h1>Match History</h1>
    </a>
    <nav>
        <a href="index.html" class="home-icon" aria-label="Home">🏠</a>
        <label class="theme-switch" aria-label="Toggle dark mode">
            <input type="checkbox" id="darkToggle">
            <span class="theme-slider"></span>
        </label>
        <button class="hamburger" id="hamburger" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
                        <div class="nav-menu" id="navMenu">
            <!-- Navigation menu loaded dynamically from navigation-menu.html -->
        </div>
    </nav>
</header>

<main id="main-content">

    <div class="leaderboard-controls">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search by Bey name or date…">
        </div>
        
        <!-- Collapsible Filter Section -->
        <div class="filters-panel" id="filtersPanel">
            <div class="filters-header" id="filtersHeader">
                <span class="filters-title">
                    <span class="filters-icon">🔍</span>
                    Filters
                    <span class="active-filters-count" id="activeFiltersCount"></span>
                </span>
                <button class="filters-toggle" id="filtersToggle">▼</button>
            </div>
            <div class="filters-content collapsed" id="filtersContent">
                <!-- Filter Controls Row -->
                <div class="filters-row">
                    <div class="filter-group">
                        <label class="filter-label" for="dateFilter">Date</label>
                        <select id="dateFilter" class="filter-select">
                            <option value="all">All Dates</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label class="filter-label" for="beyFilter">Bey</label>
                        <select id="beyFilter" class="filter-select">
                            <option value="all">All Beys</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label class="filter-label" for="bladeFilter">Blade</label>
                        <select id="bladeFilter" class="filter-select">
                            <option value="all">All Blades</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label class="filter-label" for="ratchetFilter">Ratchet</label>
                        <select id="ratchetFilter" class="filter-select">
                            <option value="all">All Ratchets</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label class="filter-label" for="bitFilter">Bit</label>
                        <select id="bitFilter" class="filter-select">
                            <option value="all">All Bits</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label class="filter-label" for="archetypeFilter">Archetype</label>
                        <select id="archetypeFilter" class="filter-select">
                            <option value="all">All Archetypes</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label class="filter-label" for="arenaFilter">Arena</label>
                        <select id="arenaFilter" class="filter-select">
                            <option value="all">All Arenas</option>
                            <option value="Xtreme">Xtreme Stadium</option>
                            <option value="Drop Attack">Drop Attack Beystadium</option>
                            <option value="Double Xtreme">Double Xtreme Stadium</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label class="filter-label" for="matchTypeFilter">Match Type</label>
                        <select id="matchTypeFilter" class="filter-select">
                            <option value="all">All Types</option>
                            <option value="exhibition">Exhibition</option>
                            <option value="season">Season</option>
                            <option value="relegation">Relegation</option>
                            <option value="season_cup">Season Cup</option>
                            <option value="qualification">Qualification</option>
                        </select>
                    </div>
                </div>
                
                <!-- Advanced Filters Row -->
                <div class="filters-row">
                    <div class="filter-group">
                        <label class="filter-label" for="seasonFilter">Season</label>
                        <select id="seasonFilter" class="filter-select">
                            <option value="all">All Seasons</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label class="filter-label" for="tierFilter">Tier</label>
                        <select id="tierFilter" class="filter-select">
                            <option value="all">All Tiers</option>
                            <option value="1">Tier I</option>
                            <option value="2">Tier II</option>
                            <option value="3">Tier III</option>
                            <option value="4">Tier IV</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label class="filter-label" for="matchdayFilter">Matchday</label>
                        <select id="matchdayFilter" class="filter-select">
                            <option value="all">All Matchdays</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label class="filter-label" for="minEloDiff">Min ELO Diff</label>
                        <input type="number" id="minEloDiff" class="filter-input" placeholder="0" min="0">
                    </div>
                    
                    <div class="filter-group">
                        <label class="filter-label" for="maxEloDiff">Max ELO Diff</label>
                        <input type="number" id="maxEloDiff" class="filter-input" placeholder="∞" min="0">
                    </div>
                    
                    <div class="filter-group">
                        <label class="filter-label" for="eloChangeFilter">ELO Change</label>
                        <select id="eloChangeFilter" class="filter-select">
                            <option value="all">All</option>
                            <option value="gain">Gains Only</option>
                            <option value="loss">Losses Only</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <button id="clearFilters" class="filter-btn">Clear Filters</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Legend Section -->
    <div class="legend" id="legend">
        <div class="legend-header">
            <span class="legend-title">Column Legend</span>
            <button class="legend-toggle" id="legendToggle">▼</button>
        </div>
        <div class="legend-content" id="legendContent">
            <!-- Populated by JavaScript -->
        </div>
    </div>

    <!-- Match Count Display -->
    <div class="match-count" id="matchCount"></div>

    <!-- Mobile Sort Controls -->
    <div class="mobile-sort-controls" id="mobileSortControls">
        <button class="sort-button" id="mobileSortButton">
            <span class="sort-icon">⇅</span>
            <span class="sort-label">Sort: </span>
            <span id="currentSortLabel">Date ↓</span>
        </button>
    </div>

    <div class="table-wrapper">
        <table id="matchesTable">
            <thead>
                <tr id="matchesHeadRow">
                    <!-- Headers populated by JavaScript -->
                </tr>
            </thead>
            <tbody id="matchesBody"></tbody>
        </table>
    </div>

    <!-- Pagination Controls -->
    <div class="pagination" id="pagination">
        <button class="pagination-btn" id="prevPage" disabled>← Previous</button>
        <span class="pagination-info">
            Page <span id="currentPage">1</span> of <span id="totalPages">1</span>
        </span>
        <button class="pagination-btn" id="nextPage" disabled>Next →</button>
        <select id="pageSize" class="filter-select">
            <option value="25">25 per page</option>
            <option value="50" selected>50 per page</option>
            <option value="100">100 per page</option>
            <option value="all">Show all</option>
        </select>
    </div>

    <!-- Mobile card list -->
    <div id="matchesCards" class="cards"></div>

    <!-- Sort Modal for Mobile -->
    <div class="sort-modal" id="sortModal">
        <div class="sort-modal-content">
            <div class="sort-modal-header">
                <h3>Sort Matches</h3>
                <button class="sort-modal-close" id="sortModalClose">&times;</button>
            </div>
            <div class="sort-modal-body" id="sortModalBody">
                <!-- Sort options populated by JavaScript -->
            </div>
        </div>
    </div>

</main>

<footer>
    <p>© 2026 suptower • <span id="site-version">Loading version...</span></p>
</footer>

<script src="version-display.js"></script>

</body>
</html>
