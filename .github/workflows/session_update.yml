name: Process Session

on:
  push:
    branches:
      - 'session-*'

permissions:
  contents: write
  pull-requests: write

jobs:
  process:
    if: |
      github.actor != 'github-actions[bot]' &&
      startsWith(github.event.head_commit.message, 'feat: add') &&
      contains(github.event.head_commit.message, 'session data')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract Session Metadata
        id: session_meta
        run: |
          SESSION_NAME="${{ github.ref_name }}"
          SESSION_NAME="${SESSION_NAME#session-}"

          RAW_DIR="archive/raw_sessions"
          MATCH_COUNT=0
          ROUND_COUNT=0

          # Find the latest complete session prefix (has both matches and rounds
          # files) — mirrors the selection logic in update_matches.py.
          shopt -s nullglob
          LATEST_PREFIX=""
          for f in "$RAW_DIR"/*_session_matches.csv; do
            base="$(basename "$f")"
            prefix="${base%_session_matches.csv}"
            if [[ -f "$RAW_DIR/${prefix}_session_rounds.csv" ]]; then
              if [[ -z "$LATEST_PREFIX" || "$prefix" > "$LATEST_PREFIX" ]]; then
                LATEST_PREFIX="$prefix"
              fi
            fi
          done
          shopt -u nullglob

          if [[ -n "$LATEST_PREFIX" ]]; then
            MATCH_FILE="$RAW_DIR/${LATEST_PREFIX}_session_matches.csv"
            ROUND_FILE="$RAW_DIR/${LATEST_PREFIX}_session_rounds.csv"
            RAW_MATCHES=$(( $(wc -l < "$MATCH_FILE") - 1 ))
            RAW_ROUNDS=$(( $(wc -l < "$ROUND_FILE") - 1 ))
            MATCH_COUNT=$(( RAW_MATCHES > 0 ? RAW_MATCHES : 0 ))
            ROUND_COUNT=$(( RAW_ROUNDS > 0 ? RAW_ROUNDS : 0 ))
          fi

          TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M UTC')

          echo "session_name=$SESSION_NAME" >> "$GITHUB_OUTPUT"
          echo "match_count=$MATCH_COUNT" >> "$GITHUB_OUTPUT"
          echo "round_count=$ROUND_COUNT" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"

      - name: Append Matches
        run: python src/utils/update_matches.py

      - name: Merge Rounds
        run: python src/utils/merge_rounds.py

      - name: Run Update Pipeline
        run: python update.py

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-output
          path: docs/

      - name: Commit source data changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          # Only stage source data files — generated artifacts are deployed to
          # the gh-pages branch by the deploy job and must not accumulate in
          # Git history.
          git add \
            docs/data/matches/ \
            docs/data/beys/ \
            docs/data/season/seasons.json \
            docs/data/season/seasons_backup.json \
            docs/data/tournaments/tournaments.json \
            archive/
          COMMIT_MSG=$(printf '%s\n\nMatches: %s\nRounds: %s\nSource branch: %s\nProcessed at: %s' \
            "session: process ${{ steps.session_meta.outputs.match_count }} matches (${{ steps.session_meta.outputs.session_name }})" \
            "${{ steps.session_meta.outputs.match_count }}" \
            "${{ steps.session_meta.outputs.round_count }}" \
            "${{ github.ref_name }}" \
            "${{ steps.session_meta.outputs.timestamp }}")
          git diff --cached --quiet || git commit -m "$COMMIT_MSG"
          git push origin HEAD:${{ github.ref_name }}

      - name: Create Pull Request
        run: |
          SESSION_NAME="${{ steps.session_meta.outputs.session_name }}"
          MATCH_COUNT="${{ steps.session_meta.outputs.match_count }}"
          ROUND_COUNT="${{ steps.session_meta.outputs.round_count }}"
          TIMESTAMP="${{ steps.session_meta.outputs.timestamp }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PR_TITLE="Session ${SESSION_NAME} • ${MATCH_COUNT} matches"
          PR_BODY=$(printf 'Automated session processing.\n\nSession: %s\nMatches: %s\nRounds: %s\nSource branch: %s\nProcessed at: %s\n\nWorkflow run:\n%s' \
            "${SESSION_NAME}" \
            "${MATCH_COUNT}" \
            "${ROUND_COUNT}" \
            "${{ github.ref_name }}" \
            "${TIMESTAMP}" \
            "${RUN_URL}")

          gh pr create \
            --base main \
            --head "${{ github.ref_name }}" \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
          || gh pr view --head "${{ github.ref_name }}" --json url --jq '.url'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: process
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false

    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-output
          path: docs/

      - name: Deploy generated docs to gh-pages
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          # Create a detached commit containing only the docs/ directory and
          # force-push it to the gh-pages branch. This overwrites the branch
          # on every run so no generated-data history accumulates.
          DEPLOY_DIR=$(mktemp -d)
          trap 'rm -rf "$DEPLOY_DIR"' EXIT
          cp -r docs/. "$DEPLOY_DIR/"
          cd "$DEPLOY_DIR"
          git init
          git add -A
          git commit -m "Deploy from ${{ github.ref_name }} - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages