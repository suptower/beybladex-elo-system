name: Process Session

on:
  push:
    branches:
      - 'session-*'

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Append Matches
        run: python src/utils/update_matches.py

      - name: Merge Rounds
        run: python src/utils/merge_rounds.py

      - name: Run Update Pipeline
        run: python update.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Process ${GITHUB_REF_NAME} - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:${{ github.ref_name }}

      - name: Create Pull Request
        run: |
          BODY="Automated session processing."
          gh pr create \
            --base main \
            --head "${{ github.ref_name }}" \
            --title "Process ${{ github.ref_name }}" \
            --body "$BODY" \
          || gh pr view --head "${{ github.ref_name }}" --json url --jq '"PR already exists: " + .url'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}