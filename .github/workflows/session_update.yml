name: Process Session

on:
  push:
    branches:
      - 'session-*'
  workflow_dispatch:      


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild Matches
        run: python scripts/rebuild_matches.py

      - name: Merge Rounds
        run: python scripts/merge_rounds.py

      - name: Run Update Pipeline
        run: python scripts/update_pipeline.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto update from session"
          git push