name: Deploy Site

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual deployment from main'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Update Pipeline
        run: python update.py

      - name: Deploy generated docs to gh-pages
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          DEPLOY_DIR=$(mktemp -d)
          trap 'rm -rf "$DEPLOY_DIR"' EXIT

          cp -r docs/. "$DEPLOY_DIR/"
          cd "$DEPLOY_DIR"

          git init
          git add -A
          git commit -m "Manual deploy from main on $(date -u +'%Y-%m-%d %H:%M UTC') - Reason: ${{ github.event.inputs.reason }}"

          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages