name: Deploy Site

on:
  workflow_dispatch:
    inputs:
      skip_plots:
        type: boolean
        description: 'Skip plot generation'
        default: false
        required: false
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual deployment from main'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref}}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Update Pipeline and skip plots if requested
        run: python update.py ${{ github.event.inputs.skip_plots == 'true' && '--skip-plots' || '' }}

      - name: Deploy generated docs to gh-pages
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          DEPLOY_DIR=$(mktemp -d)
          trap 'rm -rf "$DEPLOY_DIR"' EXIT

          cp -r docs/. "$DEPLOY_DIR/"
          cd "$DEPLOY_DIR"

          git init
          git add -A
          git commit -m "Manual deploy from ${{ github.ref }} on $(date -u +'%Y-%m-%d %H:%M UTC') - Reason: ${{ github.event.inputs.reason }}"

          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages

      - name: Collect remaining match files
        id: collect_files
        run: |
          FILES=$(find docs/data/matches -name "remaining_s*" -type f)
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Set timestamp
        id: time
        run: echo "now=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT

      - name: Delete existing release
        uses: dev-drprasad/delete-tag-and-release@v1.0
        continue-on-error: true
        with:
          tag_name: latest-matches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        if: steps.collect_files.outputs.files != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-matches
          name: "Latest Match Plans"
          body: |
            Auto-generated remaining match plans.
            
            Updated: ${{ steps.time.outputs.now }}
          draft: false
          prerelease: false
          files: ${{ steps.collect_files.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}