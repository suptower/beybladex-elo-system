<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Bronze Medal">
  <defs>
    <linearGradient id="mb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>
  <!-- Ribbon left stripe -->
  <rect x="9.25" y="1" width="2.5" height="8" rx="0.5" fill="#EF4444"/>
  <!-- Ribbon right stripe -->
  <rect x="12.25" y="1" width="2.5" height="8" rx="0.5" fill="#1D4ED8"/>
  <!-- Medal disc shadow -->
  <circle cx="12" cy="16.5" r="6" fill="#451A03"/>
  <!-- Medal disc -->
  <circle cx="12" cy="16" r="6" fill="url(#mb)"/>
  <!-- Inner decorative ring -->
  <circle cx="12" cy="16" r="4.5" fill="none" stroke="#7C2D12" stroke-width="0.75"/>
  <!-- Numeral III -->
  <rect x="9.2" y="12.5" width="1" height="7" rx="0.35" fill="#FDE68A"/>
  <rect x="11.5" y="12.5" width="1" height="7" rx="0.35" fill="#FDE68A"/>
  <rect x="13.8" y="12.5" width="1" height="7" rx="0.35" fill="#FDE68A"/>
  <!-- Shine highlight -->
  <ellipse cx="10.2" cy="13.8" rx="1.2" ry="0.9" fill="white" opacity="0.2"/>
</svg>
